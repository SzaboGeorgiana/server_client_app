plugins {
    id 'java'
}

group 'Java11ChatSockets'
version '1.0'



repositories {
    mavenCentral()
}

dependencies {
    implementation project (':ChatModel')
    runtimeOnly group: 'org.xerial', name: 'sqlite-jdbc', version: '3.16.1'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.14.0'
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.14.0'
//    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.3'
    runtimeOnly group: 'org.xerial', name: 'sqlite-jdbc', version: '3.44.1.0'

    implementation 'org.springframework.security:spring-security-crypto:5.0.17.RELEASE'
    implementation 'commons-logging:commons-logging:1.2'

    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
