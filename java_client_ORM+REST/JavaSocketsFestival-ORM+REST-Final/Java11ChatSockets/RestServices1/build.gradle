plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'Java11ChatSockets'
version = '0.0.1-SNAPSHOT'


repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'



	testImplementation group: 'junit', name: 'junit', version: '4.12'
	implementation project(':ChatModel')

	implementation project (':ChatPersistence')
	implementation("org.springframework.boot:spring-boot-starter-web")
	implementation("org.springframework.boot:spring-boot-starter-actuator")
	implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.23.1'

	implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.23.1'
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-annotations
	implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.15.0'
	// https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
	implementation 'com.fasterxml.jackson.core:jackson-core:2.15.0'

	runtimeOnly group: 'org.xerial', name: 'sqlite-jdbc', version: '3.34.0'


}

tasks.named('test') {
	useJUnitPlatform()
}
