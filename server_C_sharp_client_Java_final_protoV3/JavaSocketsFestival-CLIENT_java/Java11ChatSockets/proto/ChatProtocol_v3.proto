//}

// Define ResponseType enum specific serviciului de bilete
//enum ResponseType {
//
//  // alte tipuri de răspunsuri specifice serviciului de bilete
//}


message FestRequest {
  enum Type { FIND_ARTISTI_SPECTACOLE_BILETE = 0;
    FIND_ARTISTI_SPECTACOLE_BILETE_DUPA_DATA = 1;
    FIND_ARTISTI_SPECTACOLE_BILETE_INDEX = 2;
    FIND_ARTISTI_SPECTACOLE_BILETE_DUPA_DATA_INDEX = 3;
    //  SAVE_PERSOANA_RETURN_ID_PERS = 4;
    //  SAVE_CLIENT_RETURN_ID_CLIENT = 5;
    SAVE_BILET = 4;
    VALID = 5;
    LOGOUT = 6;}

  // Identifies which request is filled in.
  Type type = 1;

  // One of the following will be filled in, depending on the type.
  oneof payload{
    Angajat user = 2;
    string message = 3;
  }
}

message FestResponse{
  enum Type {   OK = 0;
    ERROR = 1;
    BILET_SAVED = 2;  }

  // Identifies which request is filled in.
  Type type = 1;

  // One of the following will be filled in, depending on the type.
  string error = 2;
  repeated string lista = 3;
  Angajat user=4 ;
  Spectecol spectacol=5;
  Bilet bilet=6;
  string un_singur_elem = 7;

}
