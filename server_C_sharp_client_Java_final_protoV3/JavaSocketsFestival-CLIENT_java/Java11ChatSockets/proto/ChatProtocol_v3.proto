syntax="proto3";
package proto;

option java_package = "festival.network.protoBuffProtocol";
option java_outer_classname = "FestivalProtobufs";


message Angajat {
  string nume = 1;
  string prenume = 2;
  string username = 3;
  string password = 4;
  string oficiu = 5;
  string id=6;
  // alte câmpuri specifice angajatului
}

message Bilet {
  int64 id_bilet = 1;
  int64 id_angajat = 2;
  int64 id_client = 3;
  int64 id_spectacol = 4;
  int32 nr_locuri = 5;
  // alte câmpuri specifice biletului
}

message Spectecol {
  int64 id_spectacol = 1;
  int64 id_artist = 2;
  string locatie = 3;
  string data_inc = 4;
  int32 nr_locuri = 5;
  // alte câmpuri specifice spectacolului
}


message ListaString {
  repeated string lista = 1;
  // alte câmpuri specifice, dacă este necesar
}

message string {
   string un_singur_elem = 1;
  // alte câmpuri specifice, dacă este necesar
}

message ChatException {
  string message = 1;
  // alte câmpuri specifice excepției
}

// Define RequestType enum specific serviciului de bilete
//enum RequestType {
